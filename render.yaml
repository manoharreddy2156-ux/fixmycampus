services:
  # ==========================================================
  # 1. Spring Boot Backend Web Service
  # ==========================================================
  - type: web
    name: fixmycampus-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://mysql-1629e3cc-anurag-929b.g.aivencloud.com:22092/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_UPLOAD_DIR
        value: /app/uploads

  # ==========================================================
  # 2. React Frontend (Static Site - Free & Fast Global CDN)
  # ==========================================================
  - type: web
    name: fixmycampus-frontend
    env: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fixmycampus-backend.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://fixmycampus-backend.onrender.com/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html
