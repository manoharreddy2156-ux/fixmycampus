<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Create Account — FixMyCampus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container">
        <div class="auth-wrap">
            <div class="card">
                <h1>Create your student account</h1>

                <form method="post" th:action="@{/register}" th:object="${registrationForm}" class="form-grid">
                    <div>
                        <label for="name">Full Name</label>
                        <input type="text" id="name" th:field="*{name}"/>
                        <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    <div>
                        <label for="rollNo">Roll Number</label>
                        <input type="text" id="rollNo" th:field="*{rollNo}"/>
                        <div class="field-error" th:if="${#fields.hasErrors('rollNo')}" th:errors="*{rollNo}"></div>
                    </div>
                    <div>
                        <label for="email">College Email</label>
                        <input type="email" id="email" th:field="*{email}"/>
                        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div>
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" th:field="*{phone}"/>
                    </div>
                    <div>
                        <label for="password">Password</label>
                        <input type="password" id="password" th:field="*{password}"/>
                        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <button class="btn" type="submit">Create Account</button>
                </form>

                <p class="auth-switch">Already registered? <a href="/login">Login</a></p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
