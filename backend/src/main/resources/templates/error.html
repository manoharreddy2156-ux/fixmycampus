<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Error — FixMyCampus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container">
        <div class="auth-wrap">
            <div class="card" style="text-align: center;">
                <h1 style="color: var(--danger, #dc2626);">Something went wrong</h1>
                <p class="muted" style="margin: 1rem 0;">We encountered an unexpected error processing your request.</p>
                <div class="alert alert-error" th:if="${error}" th:text="${error}" style="text-align: left; margin-bottom: 1.5rem;"></div>
                <div style="display: flex; gap: 0.75rem; justify-content: center;">
                    <a href="/" class="btn">Return Home</a>
                    <a href="/login" class="btn" style="background-color: var(--muted-bg, #64748b);">Login</a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
