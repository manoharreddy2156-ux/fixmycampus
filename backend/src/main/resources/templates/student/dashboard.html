<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My Complaints — FixMyCampus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container">
        <div class="complaint-top" style="margin-bottom:1rem;">
            <h1 style="margin:0">My Complaints</h1>
            <a class="btn" href="/student/complaints/new">+ Report New Issue</a>
        </div>

        <form class="filter-bar" method="get" th:action="@{/student/complaints}">
            <div>
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="">All</option>
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"
                            th:selected="${param.category != null and param.category[0] == c.name()}"></option>
                </select>
            </div>
            <div>
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="">All</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                            th:selected="${param.status != null and param.status[0] == s.name()}"></option>
                </select>
            </div>
            <div>
                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                    <option value="">All</option>
                    <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"
                            th:selected="${param.priority != null and param.priority[0] == p.name()}"></option>
                </select>
            </div>
            <div>
                <label for="keyword">Search</label>
                <input type="text" id="keyword" name="keyword" placeholder="location or description" th:value="${param.keyword}"/>
            </div>
            <div>
                <button class="btn btn-secondary" type="submit">Filter</button>
            </div>
        </form>

        <div class="complaint-list" th:if="${not #lists.isEmpty(complaints)}">
            <a th:each="c : ${complaints}" th:href="@{/student/complaints/{id}(id=${c.id})}"
               th:class="'complaint-card priority-' + ${c.priority}" style="display:block;color:inherit">
                <div class="complaint-top">
                    <div>
                        <div class="complaint-title" th:text="${c.category} + ' — ' + ${c.location}"></div>
                        <div class="complaint-meta" th:text="${#temporals.format(c.dateReported, 'dd MMM yyyy, HH:mm')}"></div>
                    </div>
                    <div>
                        <span th:class="'badge badge-' + ${c.status}" th:text="${c.status}"></span>
                        <span th:class="'badge badge-priority-' + ${c.priority}" th:text="${c.priority}"></span>
                    </div>
                </div>
                <div class="complaint-desc" th:text="${c.description}"></div>
            </a>
        </div>

        <div class="card" th:if="${#lists.isEmpty(complaints)}">
            <p class="muted" style="margin:0">No complaints match yet. Once you report an issue, it will show up here.</p>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
