<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Department Accounts — FixMyCampus Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container">
        <h1>Department Accounts</h1>
        <p class="muted">Create a login for each department so their staff can see and update only their own queue.</p>

        <div class="card">
            <h2>Add Department Staff</h2>
            <form method="post" th:action="@{/admin/department-users}" th:object="${departmentUserForm}" class="form-grid two-col">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" th:field="*{name}"/>
                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div>
                    <label for="departmentId">Department</label>
                    <select id="departmentId" th:field="*{departmentId}">
                        <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                    </select>
                    <div class="field-error" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}"/>
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div>
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" th:field="*{phone}"/>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}"/>
                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="btn-row" style="align-items:end">
                    <button class="btn" type="submit">Create Account</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>Existing Department Accounts</h2>
            <table class="data-table" th:if="${not #lists.isEmpty(staff)}">
                <thead>
                    <tr><th>Name</th><th>Department</th><th>Email</th><th>Phone</th></tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${staff}">
                        <td th:text="${s.name}"></td>
                        <td th:text="${s.department != null} ? ${s.department.name} : '—'"></td>
                        <td th:text="${s.email}"></td>
                        <td th:text="${s.phone}"></td>
                    </tr>
                </tbody>
            </table>
            <p class="muted" th:if="${#lists.isEmpty(staff)}" style="margin:0">No department accounts yet.</p>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
