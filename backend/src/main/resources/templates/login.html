<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login — FixMyCampus</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container">
        <div class="auth-wrap">
            <div class="card">
                <h1>Welcome back</h1>

                <p class="alert alert-success" th:if="${registered}">
                    Account created! Sign in with your new email and password.
                </p>
                <p class="alert alert-success" th:if="${param.logout}">You have been logged out.</p>
                <p class="alert alert-error" th:if="${param.error}">Incorrect email or password.</p>

                <form method="post" th:action="@{/login}" class="form-grid">
                    <div>
                        <label for="username">Email</label>
                        <input type="email" id="username" name="username" required autofocus/>
                    </div>
                    <div>
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required/>
                    </div>
                    <button class="btn" type="submit">Login</button>
                </form>

                <p class="auth-switch">New here? <a href="/register">Create a student account</a></p>
                <p class="help-text" style="margin-top:0.8rem">
                    Admin demo login: admin&#64;fixmycampus.edu / admin123<br/>
                    Department demo login: electrical&#64;fixmycampus.edu / dept123
                </p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
