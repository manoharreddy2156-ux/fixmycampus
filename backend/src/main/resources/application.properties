# ===================== Server =====================
server.port=${PORT:8080}

# ===================== MySQL (Cloud & Local) =====================
# Supports cloud deployment environment variables (Render, Railway, Heroku, Docker, AWS)
# with fallback defaults to your Aiven MySQL cloud instance.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-1629e3cc-anurag-929b.g.aivencloud.com:22092/defaultdb?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== HikariCP Connection Pool =====================
# Optimized for cloud databases (prevents idle connection drops and broken pipes)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.keepalive-time=30000

# ===================== JPA / Hibernate =====================
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# update = auto-create/alter tables from the @Entity classes in cloud defaultdb
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ===================== Thymeleaf =====================
spring.thymeleaf.cache=false

# ===================== File upload (evidence photos) =====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# ===================== Logging =====================
logging.level.org.springframework.security=INFO
logging.level.com.zaxxer.hikari=INFO

